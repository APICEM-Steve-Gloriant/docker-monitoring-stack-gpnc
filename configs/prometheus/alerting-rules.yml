groups:
- name: baseline.alerts
  rules:
  - alert: InstanceDown
    expr: up == 0
    for: 2m
    labels: { severity: critical }
    annotations: { summary: "Instance down: {{ $labels.instance }}" }

  - alert: HighCPULoad
    expr: instance:node_cpu:avg5m > 0.8
    for: 5m
    labels: { severity: warning }
    annotations: { summary: "High CPU (5m) on {{ $labels.instance }}" }
